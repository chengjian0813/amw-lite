[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "amw-lite"
version = "0.1.0"
description = "Lightweight, open-source multi-repo AI Agent Workspace CLI for small engineering teams."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "amw-lite contributors" }]
keywords = ["ai-agent", "workspace", "multi-repo", "git-worktree", "spec-driven", "code-review"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
amw-lite = "amw_lite.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amw_lite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
